<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Countdown</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .theme-selector {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .theme-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      background: #334155;
      color: #fff;
    }

    .theme-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    .card {
      display: none;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: all 0.3s ease;
    }

    .card.active {
      display: block;
    }

    /* Theme 1: Elegant Gold / Royal Wedding */
    #theme-gold {
      background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    #theme-gold h2 {
      color: #fde047;
      font-family: serif;
      letter-spacing: 1px;
    }
    #theme-gold .time-box {
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fef08a;
    }

    /* Theme 2: Romantic Rose / Floral */
    #theme-rose {
      background: linear-gradient(135deg, #1f1217 0%, #311822 100%);
      border: 1px solid rgba(244, 114, 182, 0.3);
    }
    #theme-rose h2 {
      color: #f472b6;
      font-style: italic;
    }
    #theme-rose .time-box {
      background: rgba(31, 18, 23, 0.9);
      border: 1px solid rgba(244, 114, 182, 0.4);
      color: #fbcfe8;
    }

    /* Theme 3: Modern Minimalist Clean */
    #theme-modern {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
    #theme-modern h2 {
      color: #0f172a;
      font-weight: 500;
    }
    #theme-modern .time-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0284c7;
    }

    h2 {
      margin: 0 0 24px 0;
      font-size: 1.5rem;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .time-box {
      padding: 16px 8px;
      border-radius: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .time-value {
      font-size: 1.75rem;
      display: block;
      margin-bottom: 4px;
    }

    .time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Style Selection Switcher -->
    <div class="theme-selector">
      <button class="theme-btn active" onclick="setTheme('gold')">Royal Gold</button>
      <button class="theme-btn" onclick="setTheme('rose')">Romantic Rose</button>
      <button class="theme-btn" onclick="setTheme('modern')">Clean Modern</button>
    </div>

    <!-- Theme 1: Royal Gold -->
    <div id="theme-gold" class="card active">
      <h2>The Wedding Countdown</h2>
      <div class="countdown-grid">
        <div class="time-box"><span class="time-value days">00</span><span class="time-label">Days</span></div>
        <div class="time-box"><span class="time-value hours">00</span><span class="time-label">Hours</span></div>
        <div class="time-box"><span class="time-value minutes">00</span><span class="time-label">Minutes</span></div>
        <div class="time-box"><span class="time-value seconds">00</span><span class="time-label">Seconds</span></div>
      </div>
    </div>

    <!-- Theme 2: Romantic Rose -->
    <div id="theme-rose" class="card">
      <h2>Forever Begins In...</h2>
      <div class="countdown-grid">
        <div class="time-box"><span class="time-value days">00</span><span class="time-label">Days</span></div>
        <div class="time-box"><span class="time-value hours">00</span><span class="time-label">Hours</span></div>
        <div class="time-box"><span class="time-value minutes">00</span><span class="time-label">Minutes</span></div>
        <div class="time-box"><span class="time-value seconds">00</span><span class="time-label">Seconds</span></div>
      </div>
    </div>

    <!-- Theme 3: Modern Minimalist -->
    <div id="theme-modern" class="card">
      <h2>Countdown to Nov 20, 2026</h2>
      <div class="countdown-grid">
        <div class="time-box"><span class="time-value days">00</span><span class="time-label">Days</span></div>
        <div class="time-box"><span class="time-value hours">00</span><span class="time-label">Hours</span></div>
        <div class="time-box"><span class="time-value minutes">00</span><span class="time-label">Minutes</span></div>
        <div class="time-box"><span class="time-value seconds">00</span><span class="time-label">Seconds</span></div>
      </div>
    </div>
  </div>

  <script>
    // Target date: November 20, 2026, at 00:00:00
    const targetDate = new Date('2026-11-20T00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelectorAll('.card h2').forEach(el => el.textContent = "The Wedding Day Has Arrived! 🎉");
        document.querySelectorAll('.countdown-grid').forEach(el => el.style.display = 'none');
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      // Update all active cards across themes
      document.querySelectorAll('.days').forEach(el => el.textContent = String(days).padStart(2, '0'));
      document.querySelectorAll('.hours').forEach(el => el.textContent = String(hours).padStart(2, '0'));
      document.querySelectorAll('.minutes').forEach(el => el.textContent = String(minutes).padStart(2, '0'));
      document.querySelectorAll('.seconds').forEach(el => el.textContent = String(seconds).padStart(2, '0'));
    }

    function setTheme(themeName) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById('theme-' + themeName).classList.add('active');
      event.target.classList.add('active');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
