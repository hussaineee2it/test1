<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ram Prasad & Gayathiri - Wedding Countdown</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      background: url('weddinginvite.jpeg') no-repeat center center fixed;
      background-size: cover;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 15, 0.55);
      z-index: -5;
      pointer-events: none;
    }

    .static-bg-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -4;
      pointer-events: none;
      overflow: hidden;
    }

    .airport-scene {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 260px;
      background: linear-gradient(to top, rgba(14, 165, 233, 0.15), transparent);
    }

    .airport-scene::before {
      content: '✈️ 🛫 🛬';
      position: absolute;
      bottom: 30px;
      left: 5%;
      font-size: 4.5rem;
      opacity: 0.25;
      letter-spacing: 90px;
    }

    .hospital-scene {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(244, 114, 182, 0.1) 2px, transparent 2px);
      background-size: 32px 32px;
    }

    .hospital-watermark {
      position: absolute;
      top: 12%;
      right: 6%;
      font-size: 11rem;
      opacity: 0.1;
      transform: rotate(-15deg);
    }

    .hospital-cross-badge {
      position: absolute;
      top: 15%;
      left: 8%;
      font-size: 6rem;
      opacity: 0.1;
      transform: rotate(10deg);
    }

    #flower-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      z-index: 1;
    }

    .card {
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid rgba(234, 179, 8, 0.4);
    }

    .card h2 {
      color: #fde047;
      font-family: serif;
      letter-spacing: 1px;
    }

    .card .time-box {
      background: rgba(24, 24, 27, 0.9);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fef08a;
    }

    .names-header {
      font-size: 1.25rem;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      color: #e2e8f0;
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 1.4rem;
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 24px;
      color: #cbd5e1;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .time-box {
      padding: 16px 8px;
      border-radius: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .time-value {
      font-size: 1.75rem;
      display: block;
      margin-bottom: 4px;
    }

    .time-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    /* Music Player Controls */
    .music-control {
      margin-top: 15px;
    }

    .music-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #18181b;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .music-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    @media (max-width: 480px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="wedding-audio" loop>
    <source src="weddingmusic.mpeg" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="bg-overlay"></div>

  <div class="static-bg-elements">
    <div class="hospital-scene"></div>
    <div class="hospital-watermark">🏥</div>
    <div class="hospital-cross-badge">✚</div>
    <div class="airport-scene"></div>
  </div>

  <canvas id="flower-canvas"></canvas>

  <div class="container">
    <div id="theme-gold" class="card">
      <div class="names-header">Ram Prasad Ramasamy & Gayathiri Seenivasan</div>
      <h2>The Wedding Countdown</h2>
      <div class="subtitle">One Passport, A Lifetime of Memories.</div>
      <div class="countdown-grid">
        <div class="time-box"><span class="time-value days">00</span><span class="time-label">Days</span></div>
        <div class="time-box"><span class="time-value hours">00</span><span class="time-label">Hours</span></div>
        <div class="time-box"><span class="time-value minutes">00</span><span class="time-label">Minutes</span></div>
        <div class="time-box"><span class="time-value seconds">00</span><span class="time-label">Seconds</span></div>
      </div>
      
      <!-- Interactive Play/Pause Music Button -->
      <div class="music-control">
        <button id="music-toggle-btn" class="music-btn" onclick="toggleMusic()">🎵 Play </button>
      </div>
    </div>
  </div>

  <script>
    const targetDate = new Date('2026-11-20T00:00:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.card h2').textContent = "The Wedding Day Has Arrived! 🎉";
        document.querySelector('.countdown-grid').style.display = 'none';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.querySelector('.days').textContent = String(days).padStart(2, '0');
      document.querySelector('.hours').textContent = String(hours).padStart(2, '0');
      document.querySelector('.minutes').textContent = String(minutes).padStart(2, '0');
      document.querySelector('.seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Audio & Autoplay Control Logic
    const audioEle = document.getElementById('wedding-audio');
    const musicBtn = document.getElementById('music-toggle-btn');

    function toggleMusic() {
      if (audioEle.paused) {
        audioEle.play().then(() => {
          musicBtn.textContent = "⏸️ Pause ";
        }).catch(err => {
          console.log("Audio playback failed:", err);
        });
      } else {
        audioEle.pause();
        musicBtn.textContent = "🎵 Play ";
      }
    }

    // Try autoplaying right when loaded; fallback smoothly if blocked by browser policy
    window.addEventListener('DOMContentLoaded', () => {
      audioEle.play().then(() => {
        musicBtn.textContent = "⏸️ Pause";
      }).catch(error => {
        console.log("Autoplay blocked by browser. User can use the play button.");
        musicBtn.textContent = "🎵 Play ";
        
        // Secondary fallback: Play on the very first click anywhere on the page
        document.body.addEventListener('click', () => {
          if (audioEle.paused) {
            audioEle.play().then(() => {
              musicBtn.textContent = "⏸️ Pause ";
            });
          }
        }, { once: true });
      });
    });

    const canvas = document.getElementById('flower-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 80;
        this.speedY = 0.4 + Math.random() * 1.0;
        this.swayAmplitude = 15 + Math.random() * 25;
        this.swaySpeed = 0.008 + Math.random() * 0.015;
        this.initialX = this.x;
        this.angle = Math.random() * Math.PI * 2;
        
        this.scale = 0;
        this.maxScale = 0.5 + Math.random() * 0.7;
        this.growthRate = 0.003 + Math.random() * 0.005;

        const rand = Math.random();
        if (rand < 0.3) this.type = 0;        // Blossom
        else if (rand < 0.6) this.type = 1;  // Rose
        else if (rand < 0.8) this.type = 2;  // Airplane
        else this.type = 3;                  // Stethoscope

        if (this.type === 1) {
          this.colors = ['#e11d48', '#fb7185', '#f43f5e', '#fda4af', '#be123c'];
          this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
          this.size = 18 + Math.random() * 12;
        } else if (this.type === 0) {
          this.petalCount = 5 + Math.floor(Math.random() * 3);
          this.petalRadius = 7 + Math.random() * 6;
          this.colors = ['#fbcfe8', '#f472b6', '#fde047', '#fda4af'];
          this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        } else {
          this.opacity = 0.25 + Math.random() * 0.25;
          this.iconSize = 24 + Math.random() * 16;
        }
      }

      update() {
        this.y -= this.speedY;
        this.angle += this.swaySpeed;
        this.x = this.initialX + Math.sin(this.angle) * this.swayAmplitude;

        if (this.scale < this.maxScale) {
          this.scale += this.growthRate;
        }

        if (this.y < -80) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        if (this.type === 1) {
          ctx.fillStyle = this.color;
          ctx.globalAlpha = 0.8;
          for (let p = 6; p > 0; p--) {
            ctx.beginPath();
            let radius = (this.size / 5.5) * p;
            ctx.arc(p * 2, -p * 2, radius, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = '#fff1f2';
          ctx.fill();
        } 
        else if (this.type === 0) {
          ctx.fillStyle = this.color;
          for (let i = 0; i < this.petalCount; i++) {
            const theta = (i * 2 * Math.PI) / this.petalCount;
            ctx.beginPath();
            ctx.arc(
              Math.cos(theta) * this.petalRadius,
              Math.sin(theta) * this.petalRadius,
              this.petalRadius,
              0,
              Math.PI * 2
            );
            ctx.globalAlpha = 0.75;
            ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(0, 0, this.petalRadius * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = '#fef08a';
          ctx.globalAlpha = 0.9;
          ctx.fill();
        }
        else if (this.type === 2) {
          ctx.strokeStyle = '#38bdf8';
          ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
          ctx.lineWidth = 2;
          ctx.globalAlpha = this.opacity;
          
          ctx.beginPath();
          ctx.moveTo(0, -this.iconSize);
          ctx.lineTo(this.iconSize * 0.3, -this.iconSize * 0.2);
          ctx.lineTo(this.iconSize, this.iconSize * 0.2);
          ctx.lineTo(this.iconSize * 0.3, this.iconSize * 0.3);
          ctx.lineTo(this.iconSize * 0.2, this.iconSize);
          ctx.lineTo(0, this.iconSize * 0.7);
          ctx.lineTo(-this.iconSize * 0.2, this.iconSize);
          ctx.lineTo(-this.iconSize * 0.3, this.iconSize * 0.3);
          ctx.lineTo(-this.iconSize, this.iconSize * 0.2);
          ctx.lineTo(-this.iconSize * 0.3, -this.iconSize * 0.2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        else if (this.type === 3) {
          ctx.strokeStyle = '#f472b6';
          ctx.fillStyle = 'rgba(244, 114, 182, 0.25)';
          ctx.lineWidth = 2.5;
          ctx.globalAlpha = this.opacity;

          ctx.beginPath();
          ctx.arc(0, 0, this.iconSize * 0.5, 0, Math.PI, false);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, this.iconSize * 0.6, this.iconSize * 0.25, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    const particles = Array.from({ length: 32 }, () => new Particle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    animateParticles();
  </script>
</body>
</html>
